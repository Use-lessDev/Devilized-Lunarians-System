plugins {
    id 'java'
}

version = '3.80.2'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

repositories {
    mavenCentral()
    maven { url 'https://raw.githubusercontent.com/Zelaux/Repo/master/repository' }
    maven { url 'https://jitpack.io' }
}

sourceSets {
    main {
        java.srcDirs = ['src']
    }
}

dependencies {
    compileOnly "com.github.Anuken.Arc:arc-core:$mindustryVersion"
    compileOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// JAR para PC: classes + mod.json + icon.png na raiz + assets/
jar {
    archiveFileName = "${project.name}Desktop.jar"
    from(rootDir) {
        include 'mod.json'
        include 'icon.png'
    }
    from("$rootDir/assets") {
        include '**'
    }
}

// JAR hibrido PC + Android: junta os .class com um classes.dex gerado pelo d8
task jarAndroid(dependsOn: jar) {
    doLast {
        def sdkRoot = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
        if (!sdkRoot || !new File(sdkRoot).exists()) {
            throw new GradleException('Defina ANDROID_HOME (Android SDK com build-tools e uma plataforma).')
        }
        def btDir = new File(sdkRoot, 'build-tools')
        def bt = btDir.listFiles().findAll { it.isDirectory() }.sort { it.name }.last()
        def d8 = new File(bt, System.getProperty('os.name').toLowerCase().contains('win') ? 'd8.bat' : 'd8')
        def platDir = new File(sdkRoot, 'platforms')
        def plat = platDir.listFiles().findAll { it.isDirectory() && new File(it, 'android.jar').exists() }.sort { it.name }.last()
        def androidJar = new File(plat, 'android.jar')

        def desktopJar = jar.archiveFile.get().asFile
        def deps = configurations.compileClasspath.files.collect { it.absolutePath }
        def tmp = new File(buildDir, 'd8out')
        tmp.deleteDir(); tmp.mkdirs()

        def cmd = [d8.absolutePath, '--lib', androidJar.absolutePath]
        deps.each { cmd += ['--classpath', it] }
        cmd += ['--min-api', '14', '--output', tmp.absolutePath, desktopJar.absolutePath]
        def proc = new ProcessBuilder(cmd).inheritIO().start()
        if (proc.waitFor() != 0) throw new GradleException('d8 falhou')

        def out = new File(buildDir, "libs/${project.name}.jar")
        ant.zip(destfile: out) {
            zipfileset(src: desktopJar)
            zipfileset(dir: tmp, includes: 'classes.dex')
        }
        println "JAR hibrido PC+Android: ${out}"
    }
}

task deploy(dependsOn: jarAndroid) {
    doLast {
        println 'Pronto: build/libs/' + project.name + '.jar'
    }
}
