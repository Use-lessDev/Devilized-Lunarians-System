apply plugin: 'java'

version = '1.0.0'
group = 'theworldsteps'
sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
    maven { url 'https://repo1.maven.org/maven2' }
}

dependencies {
    compileOnly files('libs/mindustry-v154.jar')
    compileOnly files('libs/arc-core.jar')
}

sourceSets {
    main {
        srcDirs = ['src']
    }
}
